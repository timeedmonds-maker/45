# Registered workflow trigger refresh
name: Isolated resumable team rebound build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-team-trb.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: isolated-team-rebound-build
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

env:
  PYTHONUNBUFFERED: '1'
  SOURCE_COMMIT: 'c4c83df1735fa6661659b52b46e8623005aeb12c'
  CHECKPOINT_ROOT: 'team_trb_checkpoints'
  RETRY_ROOT: 'team_trb_retry_state'
  FINAL_ROOT: 'team_trb_output'
  STATUS_ISSUE: '1'
  STATUS_COMMENT_ID: '5161413618'

jobs:
  cycle:
    runs-on: ubuntu-slim
    timeout-minutes: 14

    steps:
      - name: Check out clean execution repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out validated source pipeline read-only
        uses: actions/checkout@v4
        with:
          repository: timeedmonds-maker/104
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare persistent output directories
        run: |
          mkdir -p "$CHECKPOINT_ROOT" "$RETRY_ROOT" "$FINAL_ROOT"

      - name: Compile source pipeline
        run: |
          python -m py_compile \
            source/team_trb_all_players/full_adaptive_batch.py \
            source/team_trb_all_players/slim_cached_batch.py \
            source/team_trb_all_players/slim_checkpoint_plan.py \
            source/team_trb_all_players/slim_run_one.py \
            source/team_trb_all_players/slim_collect.py \
            source/team_trb_all_players/slim_record_attempt.py \
            source/team_trb_all_players/slim_checkpoint_aggregate.py

      - name: Select one fair incomplete team-season
        id: plan
        env:
          PBPSTATS_CHECKPOINT_ROOT: ${{ env.CHECKPOINT_ROOT }}
          PBPSTATS_RETRY_ROOT: ${{ env.RETRY_ROOT }}
          PBPSTATS_FINAL_MARKER: ${{ env.FINAL_ROOT }}/aggregate_complete.json
        run: python source/team_trb_all_players/slim_checkpoint_plan.py

      - name: Restore partial windows for selected team-season
        if: ${{ steps.plan.outputs.has_work == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: work/${{ steps.plan.outputs.season }}/${{ steps.plan.outputs.team_id }}
          key: isolated-team-trb-${{ steps.plan.outputs.task_key }}-${{ github.run_id }}
          restore-keys: |
            isolated-team-trb-${{ steps.plan.outputs.task_key }}-

      - name: Install API dependency
        if: ${{ steps.plan.outputs.has_work == 'true' }}
        run: python -m pip install --disable-pip-version-check requests

      - name: Extract and validate selected team-season
        if: ${{ steps.plan.outputs.has_work == 'true' }}
        id: extract
        env:
          PBPSTATS_SEASON: ${{ steps.plan.outputs.season }}
          PBPSTATS_FROM_DATE: ${{ steps.plan.outputs.from_date }}
          PBPSTATS_TO_DATE: ${{ steps.plan.outputs.to_date }}
          PBPSTATS_GROUP: ${{ steps.plan.outputs.group }}
          PBPSTATS_TEAM_IDS: ${{ steps.plan.outputs.team_ids }}
          PBPSTATS_TOP_WINDOW_DAYS: '14'
          PBPSTATS_CONNECT_TIMEOUT: '8'
          PBPSTATS_READ_TIMEOUT: '25'
          PBPSTATS_REQUEST_PAUSE: '0.45'
          PBPSTATS_RUNTIME_LIMIT_SECONDS: '480'
          PBPSTATS_OUTPUT_DIR: work/${{ steps.plan.outputs.season }}/${{ steps.plan.outputs.team_id }}
        run: python source/team_trb_all_players/slim_run_one.py

      - name: Preserve incomplete partial windows
        if: ${{ always() && steps.plan.outputs.has_work == 'true' && steps.extract.outputs.completed != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: work/${{ steps.plan.outputs.season }}/${{ steps.plan.outputs.team_id }}
          key: isolated-team-trb-${{ steps.plan.outputs.task_key }}-${{ github.run_id }}

      - name: Accept only fully validated checkpoint
        if: ${{ always() && steps.plan.outputs.has_work == 'true' }}
        id: collect
        run: python source/team_trb_all_players/slim_collect.py work "$CHECKPOINT_ROOT"

      - name: Record retry state
        if: ${{ always() && steps.plan.outputs.has_work == 'true' }}
        run: |
          python source/team_trb_all_players/slim_record_attempt.py \
            --season '${{ steps.plan.outputs.season }}' \
            --team-id '${{ steps.plan.outputs.team_id }}' \
            --completed '${{ steps.extract.outputs.completed }}' \
            --timed-out '${{ steps.extract.outputs.timed_out }}' \
            --root "$RETRY_ROOT" \
            --runner-result 'work/${{ steps.plan.outputs.season }}/${{ steps.plan.outputs.team_id }}/runner_result.json'

      - name: Recount validated checkpoints
        id: after
        env:
          PBPSTATS_CHECKPOINT_ROOT: ${{ env.CHECKPOINT_ROOT }}
          PBPSTATS_RETRY_ROOT: ${{ env.RETRY_ROOT }}
          PBPSTATS_FINAL_MARKER: ${{ env.FINAL_ROOT }}/aggregate_complete.json
        run: python source/team_trb_all_players/slim_checkpoint_plan.py

      - name: Build final career leaderboard
        if: ${{ steps.after.outputs.needs_aggregate == 'true' }}
        run: python source/team_trb_all_players/slim_checkpoint_aggregate.py "$CHECKPOINT_ROOT" "$FINAL_ROOT"

      - name: Commit validated progress and retry ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$CHECKPOINT_ROOT" "$RETRY_ROOT" "$FINAL_ROOT"
          if git diff --cached --quiet; then
            echo "No repository progress to commit."
          else
            git commit -m "Team rebound checkpoint cycle $GITHUB_RUN_ID"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload cycle diagnostics
        if: ${{ always() && steps.plan.outputs.has_work == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: isolated-cycle-${{ steps.plan.outputs.task_key }}-${{ github.run_id }}
          path: work/${{ steps.plan.outputs.season }}/${{ steps.plan.outputs.team_id }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload completed career dataset
        if: ${{ steps.after.outputs.needs_aggregate == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: career-team-trb-complete-dataset
          path: ${{ env.FINAL_ROOT }}/
          if-no-files-found: error
          retention-days: 90

      - name: Update persistent build status
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          TASK_KEY: ${{ steps.plan.outputs.task_key }}
          HAS_WORK: ${{ steps.plan.outputs.has_work }}
          COMPLETED: ${{ steps.extract.outputs.completed }}
          TIMED_OUT: ${{ steps.extract.outputs.timed_out }}
          COPIED: ${{ steps.collect.outputs.copied }}
          COMPLETE_COUNT: ${{ steps.after.outputs.complete_count }}
          PENDING_TOTAL: ${{ steps.after.outputs.pending_total }}
          DONE: ${{ steps.after.outputs.done }}
        with:
          github-token: ${{ github.token }}
          script: |
            const hasWork = process.env.HAS_WORK === 'true';
            const completed = process.env.COMPLETED === 'true';
            const done = process.env.DONE === 'true';
            let outcome = 'No task selected.';
            if (hasWork) {
              outcome = completed
                ? `${process.env.TASK_KEY} validated and checkpointed.`
                : `${process.env.TASK_KEY} incomplete; partial windows preserved for retry.`;
            }
            const body = [
              `**Isolated executor run ${context.runId}**`,
              outcome,
              `Progress: **${process.env.COMPLETE_COUNT || '0'}/780** validated team-seasons.`,
              `Pending: ${process.env.PENDING_TOTAL || '780'}.`,
              `Timed out: ${process.env.TIMED_OUT || 'false'}.`,
              `Final dataset complete: ${done}.`,
              `Source pipeline commit: \`${process.env.SOURCE_COMMIT}\`.`
            ].join('\n\n');
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number(process.env.STATUS_COMMENT_ID),
              body
            });
