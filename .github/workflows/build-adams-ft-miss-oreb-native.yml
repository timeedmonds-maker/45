name: Build Adams FT-miss OREB native angles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nba_native_video/build_adams_ft_miss_oreb_all_angles_2025_26.py"
      - ".github/workflows/build-adams-ft-miss-oreb-native.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          python -m pip install pandas requests
      - name: Build native official NBA angle files
        run: |
          python nba_native_video/build_adams_ft_miss_oreb_all_angles_2025_26.py
      - name: Upload native video parts and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adams-ft-miss-oreb-native-2025-26
          path: |
            outputs/adams_ft_miss_oreb_all_angles_2025_26/downloads/*.zip
            outputs/adams_ft_miss_oreb_all_angles_2025_26/event_manifest.csv
            outputs/adams_ft_miss_oreb_all_angles_2025_26/event_manifest.json
            outputs/adams_ft_miss_oreb_all_angles_2025_26/video_inventory.csv
            outputs/adams_ft_miss_oreb_all_angles_2025_26/video_qa.json
            outputs/adams_ft_miss_oreb_all_angles_2025_26/download_parts.json
          retention-days: 1
          if-no-files-found: warn
